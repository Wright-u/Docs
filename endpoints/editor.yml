openapi: '3.0.3'
info:
  title: Editor Service API
  version: '1.0'
servers:
  - url: http://localhost:5000/api
paths:
  /editor/elements:
    get:
      summary: Get all elements
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                    position:
                      type: object
                      properties:
                        x:
                          type: number
                        y:
                          type: number
                    zIndex:
                      type: number
                    domain-draw-data:
                      type: object
                    entity:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        metadata:
                          type: object
                    

